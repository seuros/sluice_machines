[package]
name = "sluice-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bounded checkpoint barrier alignment"
repository = "https://github.com/seuros/sluice_machines"
readme = "README.md"
categories = ["no-std"]
exclude = [".github/", ".release-please-manifest.json", "release-please-config.json"]

[dependencies]
periscope-machines = { version = ">=0.5", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
